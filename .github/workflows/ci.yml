name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: primaria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d primaria_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/primaria_test
      DIRECT_DATABASE_URL: postgresql://test:test@localhost:5432/primaria_test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Check migration drift
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^prisma/"; then
            echo "Prisma files changed — checking for migration drift..."
            npx prisma migrate diff \
              --from-migrations ./prisma/migrations \
              --to-schema-datamodel ./prisma/schema.prisma \
              --exit-code
          else
            echo "No prisma/ changes — skipping drift check"
          fi

      - name: Run tests
        run: npm test
