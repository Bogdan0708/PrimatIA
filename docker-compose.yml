# PrimărIA - Docker Compose (dev infrastructure only, app runs locally)
# Usage: docker compose up -d

services:
  # ──────────────────────────────────────────────
  # PostgreSQL 16 with Row-Level Security support
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: primaria-postgres
    restart: unless-stopped
    ports:
      - "5433:5432" # 5433 on host to avoid conflict with any local PostgreSQL
    environment:
      POSTGRES_USER: primaria_admin
      POSTGRES_PASSWORD: primaria_dev_password
      POSTGRES_DB: primaria
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primaria_admin -d primaria"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────
  # PgBouncer - connection pooler (transaction mode)
  # ──────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: primaria-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro

  # ──────────────────────────────────────────────
  # Redis 7 - caching & session store
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: primaria-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────
  # MinIO - S3-compatible object storage
  # ──────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: primaria-minio
    restart: unless-stopped
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: primaria_minio
      MINIO_ROOT_PASSWORD: primaria_minio_secret
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local
