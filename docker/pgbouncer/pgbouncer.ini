;; PrimărIA - PgBouncer Configuration
;; Transaction-level pooling for efficient connection reuse

[databases]
primaria = host=postgres port=5432 dbname=primaria

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Transaction pooling: connections are returned to the pool after each transaction
pool_mode = transaction

;; Pool sizing
default_pool_size = 20
max_client_conn = 100
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

;; Timeouts
server_idle_timeout = 600
client_idle_timeout = 0
client_login_timeout = 60
query_timeout = 0
query_wait_timeout = 120

;; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

;; Admin access
admin_users = primaria_admin
stats_users = primaria_admin
