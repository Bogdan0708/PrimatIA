release_gate:
  version: "1.0"
  automated:
    - name: Type check
      command: npm run type-check
      required: true
      blocker: true

    - name: Unit tests
      command: npm test
      required: true
      blocker: true

    - name: Lint
      command: npm run lint
      required: true
      blocker: false

    - name: Production build
      command: npm run build
      required: true
      blocker: true

    - name: Prisma schema validation
      command: npx prisma validate
      required: true
      blocker: true

    - name: Migration deploy (dry run)
      command: npx prisma migrate deploy
      required: true
      blocker: true
      note: "Run against staging DB first"

    - name: db-preflight
      command: "npm run db:preflight:strict"
      required: true
      blocker: true

  conditional:
    - name: Migration drift check
      command: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma
      when: "PR touches prisma/migrations/"
      required: true

    - name: Import/rollback verification
      command: "npm test -- --grep 'import'"
      when: "PR touches src/app/api/plati/ or src/lib/import/"
      required: true

    - name: Payment flow verification
      command: "npm test -- --grep 'payment'"
      when: "PR touches src/app/api/payments/ or src/lib/payments/"
      required: true

  evidence:
    required_artifact: "release-evidence-<run_number>"
    required_release_note_path: "docs/releases/<timestamp>-<RC_ID>.md"
    staging_gate_workflow: ".github/workflows/staging-release-gate.yml"

  manual:
    - name: Liveness endpoint check
      description: "curl /api/health returns 200 with status: ok"
      required: true

    - name: Deep health check
      description: "curl /api/health/deep returns 200 with database ok, redis ok, and AI not error"
      required: true

    - name: AI smoke check
      description: "Run one authenticated PrimarIA chatbot or OCR request against the configured AI gateway using the active tenant"
      required: true

    - name: Smoke test
      description: "Log in as staff, view dashboard, check a taxpayer record"
      required: true

    - name: Rollback tested
      description: "Run deploy/rollback.sh --dry-run to verify previous revision exists"
      required: true

    - name: Canary soak
      description: "deploy-canary.sh ran successfully with 60s soak period"
      required: false
      note: "Required for high-risk changes"

    - name: PR Documentation
      description: "Risk level and rollback plan documented in PR"
      required: true

    - name: Tenant Release Inputs
      description: "Tenant-specific release inputs recorded for import/rollback flows"
      required: true

    - name: Evidence Review
      description: "Approver confirms release evidence reviewed before merge"
      required: true
