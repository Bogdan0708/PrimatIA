steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-central2-docker.pkg.dev/$PROJECT_ID/primaria/app:$COMMIT_SHA', '-t', 'europe-central2-docker.pkg.dev/$PROJECT_ID/primaria/app:prod', '-t', 'europe-central2-docker.pkg.dev/$PROJECT_ID/primaria/app:latest', '.']

  # Step 2: Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'europe-central2-docker.pkg.dev/$PROJECT_ID/primaria/app']

  # Step 3: Run database migrations
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: 
      - '-c'
      - 'docker run --rm -e DATABASE_URL=$$DATABASE_URL -e DIRECT_DATABASE_URL=$$DIRECT_DATABASE_URL europe-central2-docker.pkg.dev/$PROJECT_ID/primaria/app:$COMMIT_SHA npx prisma migrate deploy'
    secretEnv: ['DATABASE_URL', 'DIRECT_DATABASE_URL']

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'primaria'
      - '--image'
      - 'europe-central2-docker.pkg.dev/$PROJECT_ID/primaria/app:$COMMIT_SHA'
      - '--region'
      - 'europe-central2'
      - '--max-instances'
      - '10'
      - '--no-cpu-throttling'
      - '--cpu-boost'
      - '--vpc-connector'
      - 'primaria-vpc'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:europe-central2:primaria-db'
      - '--set-env-vars'
      - 'NODE_ENV=production,AUTH_TRUST_HOST=true,TENANT_ID=${_TENANT_ID},NEXTAUTH_URL=${_NEXTAUTH_URL}'
      - '--set-secrets'
      - 'DATABASE_URL=primaria-database-url:latest,DIRECT_DATABASE_URL=primaria-direct-database-url:latest,NEXTAUTH_SECRET=primaria-nextauth-secret:latest,JWT_SECRET=primaria-jwt-secret:latest,CNP_ENCRYPTION_KEY=primaria-cnp-encryption-key:latest,CNP_TENANT_SALT_SECRET=primaria-cnp-tenant-salt:latest,REDIS_URL=primaria-redis-url:latest,STRIPE_SECRET_KEY=primaria-stripe-key:latest,STRIPE_WEBHOOK_SECRET=primaria-stripe-webhook:latest,AI_GATEWAY_URL=primaria-ai-gateway-url:latest,AI_GATEWAY_KEY=primaria-ai-gateway-key:latest'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/primaria-database-url/versions/latest
      env: 'DATABASE_URL'
    - versionName: projects/$PROJECT_ID/secrets/primaria-direct-database-url/versions/latest
      env: 'DIRECT_DATABASE_URL'

images:
  - 'europe-central2-docker.pkg.dev/$PROJECT_ID/primaria/app:$COMMIT_SHA'
