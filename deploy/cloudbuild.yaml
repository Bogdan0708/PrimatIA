steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-central2-docker.pkg.dev/$PROJECT_ID/primaria/app:$COMMIT_SHA', '.']

  # Step 2: Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-central2-docker.pkg.dev/$PROJECT_ID/primaria/app:$COMMIT_SHA']

  # Step 3: Run database migrations (using direct connection, bypasses PgBouncer)
  - name: 'europe-central2-docker.pkg.dev/$PROJECT_ID/primaria/app:$COMMIT_SHA'
    entrypoint: 'npx'
    args: ['prisma', 'migrate', 'deploy']
    secretEnv: ['DATABASE_URL']

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'primaria'
      - '--image'
      - 'europe-central2-docker.pkg.dev/$PROJECT_ID/primaria/app:$COMMIT_SHA'
      - '--region'
      - 'europe-central2'
      - '--max-instances'
      - '10'
      - '--no-cpu-throttling'
      - '--set-env-vars'
      - 'NODE_ENV=production,AUTH_TRUST_HOST=true'
      - '--set-secrets'
      - 'DATABASE_URL=primaria-database-url:latest,DIRECT_DATABASE_URL=primaria-direct-database-url:latest,NEXTAUTH_SECRET=primaria-nextauth-secret:latest,JWT_SECRET=primaria-jwt-secret:latest,CNP_ENCRYPTION_KEY=primaria-cnp-encryption-key:latest,CNP_TENANT_SALT_SECRET=primaria-cnp-tenant-salt:latest,REDIS_URL=primaria-redis-url:latest,STRIPE_SECRET_KEY=primaria-stripe-key:latest,STRIPE_WEBHOOK_SECRET=primaria-stripe-webhook:latest,AI_GATEWAY_URL=primaria-ai-gateway-url:latest,AI_GATEWAY_KEY=primaria-ai-gateway-key:latest'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/primaria-direct-database-url/versions/latest
      env: 'DATABASE_URL'

images:
  - 'europe-central2-docker.pkg.dev/$PROJECT_ID/primaria/app:$COMMIT_SHA'
