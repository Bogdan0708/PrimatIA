# =============================================================================
# PrimărIA - Docker Compose (production)
# =============================================================================
# Usage:
#   cp .env.production.example .env
#   # Edit .env with real values
#   docker compose -f docker-compose.production.yml up -d --build
# =============================================================================

services:
  # ──────────────────────────────────────────────
  # Next.js Application
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: primaria-app
    restart: always
    ports:
      - "3000:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_started
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - primaria-network

  # ──────────────────────────────────────────────
  # Database migrations (runs once before app starts)
  # ──────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: primaria-migrate
    env_file:
      - .env
    environment:
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - primaria-network

  # ──────────────────────────────────────────────
  # PostgreSQL 16 with Row-Level Security support
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: primaria-postgres
    restart: always
    # Ports not exposed to host in production — accessible only via Docker network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-primaria_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-primaria}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-primaria_admin} -d ${POSTGRES_DB:-primaria}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - primaria-network

  # ──────────────────────────────────────────────
  # PgBouncer - connection pooler (transaction mode)
  # ──────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: primaria-pgbouncer
    restart: always
    # No ports exposed to host in production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U primaria_admin"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - primaria-network

  # ──────────────────────────────────────────────
  # Redis 7 - caching & session store
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: primaria-redis
    restart: always
    # No ports exposed to host in production
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-CHANGE_ME}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME}
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CHANGE_ME}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - primaria-network

  # ──────────────────────────────────────────────
  # MinIO - S3-compatible object storage
  # ──────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: primaria-minio
    restart: always
    # No ports exposed to host in production
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-CHANGE_ME}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-CHANGE_ME}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - primaria-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local

networks:
  primaria-network:
    driver: bridge
